; Límites de PHP para la API (LiteSpeed los lee de aquí en el hosting compartido).
; Las partes del video llegan crudas (8 MB) y no pasan por upload_max_filesize;
; esto cubre el multipart chico y el análisis del worker.
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
memory_limit = 256M
display_errors = Off
log_errors = On
