# Local services for pp-coach-tracker (Docker runs in WSL):
#   npm run db:up      MySQL 8 on localhost:13306 (database and user ppcoachtracker)
# Port 13306 so it does not clash with a MySQL installed on Windows (3306).
# The schema is loaded on the first start; `npm run db:down` keeps the data
# volume, `wsl -e docker compose down -v` wipes it.
# Local development passwords only: production uses its own .env.
name: ppcoachtracker

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ppcoachtracker-root
      MYSQL_DATABASE: ppcoachtracker
      MYSQL_USER: ppcoachtracker
      MYSQL_PASSWORD: ppcoachtracker-dev
    ports:
      # Not 127.0.0.1: WSL2 only forwards to Windows the ports bound to all
      # interfaces inside the VM (the VM itself is behind NAT, not on the LAN).
      # Hyper-V may reserve 13306 on Windows (netsh interface ipv4 show
      # excludedportrange protocol=tcp); then use DB_HOST_PORT=23306 and DB_PORT=23306.
      - "${DB_HOST_PORT:-13306}:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ppcoachtracker-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uppcoachtracker", "-pppcoachtracker-dev"]
      interval: 5s
      retries: 20
    networks: [default, ppcoachtracker-dev]

  # The PHP API (php/), as on Cloud Provider, on http://localhost:8097/pp-coach-tracker.
  # Test settings: the static tokens are what tests/php/contract.test.js expects;
  # the part and chunk limits are production's.
  php:
    build: ./php/docker
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ppcoachtracker
      DB_USER: ppcoachtracker
      DB_PASSWORD: ppcoachtracker-dev
      JWT_SECRET: test-jwt-secret-0123456789abcdefghijkl
      WORKER_CALLBACK_SECRET: test-worker-secret-0123456789
      API_TOKENS: test-coach1:test-token-0123456789,test-coach2:other-coach-token-9876
      MAX_PART_BYTES: "8388608"
      MAX_CHUNK_BYTES: "167772160"
      # Writable by Apache's www-data; lost when the container is recreated.
      STORAGE_DIR: /tmp/pp-coach-tracker-storage
      PP_COACH_TRACKER_ROOT: /app
    ports:
      - "${PHP_HOST_PORT:-8097}:80"
    volumes:
      - ./php:/app
      - ./php/public:/var/www/html/pp-coach-tracker
      # The same API with REQUIRE_META and a small chunk limit (see the Dockerfile).
      - ./php/public:/var/www/html/pp-coach-tracker-strict
      - ./db:/db:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks: [default, ppcoachtracker-dev]

  # The analysis worker (../worker), with the code mounted so changes apply on
  # restart. Only with --profile worker. In development SAM goes to the local
  # simulator (docs/13-entorno-desarrollo.md) through SAM_API_BASE_URL in .env.
  worker:
    profiles: ["worker"]
    build:
      context: ../worker
      args:
        DEV: "1"
    env_file:
      - path: ../.env
        required: false
    environment:
      PP_COACH_TRACKER_API_URL: http://php/pp-coach-tracker
      WORKER_CALLBACK_SECRET: test-worker-secret-0123456789
      POLL_SECONDS: "5"
      META_CACHE_DIR: /worker/.local/meta_cache
      WORK_DIR: /worker/.local/jobs
      # Each job also saved for the viewer (video: under worker/.local/, not versioned).
      DEBUG_DIR: /worker/.local/runs
    volumes:
      - ../worker:/worker
    depends_on:
      - php
    networks: [default, ppcoachtracker-dev]

  # The viewer (../viewer) of the runs in worker/.local/runs, on http://localhost:8098.
  # It also reads the runs saved by hand for comparisons (VIEWER_EXTRA_RUNS,
  # LOCAL_DATA/Results by default; not versioned).
  viewer:
    profiles: ["viewer"]
    build: ../viewer
    ports:
      - "${VIEWER_HOST_PORT:-8098}:8098"
    environment:
      RUNS_DIR: /runs,/extra
    volumes:
      - ../worker/.local/runs:/runs:ro
      - ${VIEWER_EXTRA_RUNS:-../LOCAL_DATA/Results}:/extra:ro
      - ppcoachtracker-viewer-cache:/cache

volumes:
  ppcoachtracker-viewer-cache:
  ppcoachtracker-mysql:

networks:
  # Shared with the SAM simulator (docs/13-entorno-desarrollo.md):
  #   wsl -e docker network create ppcoachtracker-dev
  ppcoachtracker-dev:
    external: true
